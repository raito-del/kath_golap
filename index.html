<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কাঠগোলাপ · Kathgolap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>
 
  <main>
    <div id="stage">
      <canvas id="c" width="800" height="800" title="Click to replay"></canvas>
    </div>
 
    <section class="caption">
      <h1>কাঠগোলাপ</h1>
      <p class="sub">Frangipani, written in every language of love</p>
      <div class="actions">
        <button id="replay" type="button">↻ Replay</button>
        <button id="save" type="button">⬇ Save image</button>
      </div>
    </section>
  </main>
 
  <footer id="credit" aria-label="Made by Sadnan Ahmed">
    <span class="by">Made by</span>
    <span class="name">Sadnan Ahmed</span>
    <span class="heart" aria-hidden="true">❤</span>
  </footer>
 
  <script src="script.js"></script>
</body>
</html>
